<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Animada</title>
</head>
<style>

.gallery-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    padding:40px;
    overflow:hidden;
}

.gallery-container .gallery{
    display:flex;
    gap:15px;
    width:100%;
    max-width:1200px;
    height:500px;
}

.gallery-container .gallery .card{
    flex:1;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:all .6s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    position:relative;
}

.gallery-container .gallery .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .8s ease;
}

.gallery-container .gallery  .card:hover{
    flex:5;
}

.gallery-container .gallery.card:hover img{
    transform:scale(1.15);
}

.gallery-container .gallery:hover .card:not(:hover){
    filter:brightness(.5);
}
</style>
<body>

    <div class="gallery-container">
  <div class="gallery">
    <div class="card">
      <img src="https://picsum.photos/id/1015/600/400" alt="">
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1016/600/400" alt="">
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1018/600/400" alt="">
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1020/600/400" alt="">
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1024/600/400" alt="">
    </div>
  </div>
</div>

</body>
</html>
