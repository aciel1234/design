<style>
.btn-shine{
    position:relative;
    overflow:hidden;

    padding:15px 35px;

    border:none;
    border-radius:10px;

    background:#111827;
    color:white;

    font-size:18px;
    cursor:pointer;
}

.btn-shine::before{

    content:"";

    position:absolute;

    top:0;
    left:-120px;

    width:80px;
    height:100%;

    background:
    rgba(255,255,255,.4);

    transform:skewX(-25deg);

    transition:.6s;
}

.btn-shine:hover::before{
    left:120%;
}
</style>

<button class="btn-shine">Descargar</button>
